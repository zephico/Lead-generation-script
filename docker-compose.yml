services:
  postgres:
    image: postgres:16
    container_name: reddit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadgen
    ports:
      - "5434:5432"
    volumes:
      - reddit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadgen"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  reddit_pgdata:
